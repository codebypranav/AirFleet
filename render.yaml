# Render Blueprint for the AirFleet backend (free plan).
# The database lives on Neon and the frontend on Vercel, so only the API is defined here.
# Deploy: Render dashboard -> New -> Blueprint -> pick this repo.
services:
  - type: web
    name: airfleet-api
    runtime: docker
    plan: free
    # Same area as the Neon database (AWS us-east-2). Only applies when the service is created.
    region: ohio
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/rankings/
    autoDeploy: true
    buildFilter:
      paths:
        - backend/**
        - render.yaml
    envVars:
      # Neon connection string, e.g. postgresql://user:pass@ep-xxx.neon.tech/neondb?sslmode=require
      - key: DATABASE_URL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      # Neon Object Storage for flight photos (from `neon link` / .env.local)
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_ENDPOINT_URL_S3
        sync: false
      - key: AWS_REGION
        value: us-east-2
      # Base URL of the Vercel frontend, used in password-reset emails
      - key: FRONTEND_URL
        value: https://airfleet.vercel.app
      # Same OAuth client ID as the frontend's GOOGLE_CLIENT_ID; leave unset to disable Google sign-in
      - key: GOOGLE_CLIENT_ID
        sync: false
      # SMTP for password-reset emails; without EMAIL_HOST they're only written to the logs
      - key: EMAIL_HOST
        sync: false
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: DEFAULT_FROM_EMAIL
        sync: false
